    <feFlood flood-color="#3a2517" flood-opacity="0.3" result="shColor"/>
    <feComposite in="shColor" in2="shBlur" operator="in" result="shadow"/>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="border"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

