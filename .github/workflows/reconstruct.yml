name: Assemble PEELBEAST build

on:
  push:
    branches: [main]
    paths:
      - UPLOAD_COMPLETE

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct browser build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat source_chunks/index.*.txt | base64 --decode | gzip -d > index.html
          cat asset_chunks/atlas.*.txt | base64 --decode > assets/atlas.webp
          test -s index.html
          test -s assets/atlas.webp
      - name: Commit assembled files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/atlas.webp
          git rm -r source_chunks asset_chunks UPLOAD_COMPLETE
          git commit -m "Assemble PEELBEAST v0.8 build"
          git push
