name: Reconstruct PEELBEAST image assets

on:
  push:
    branches:
      - agent/image-assets-pack-v1
    paths:
      - 'image-assets/upload_chunks/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct ZIP and extract assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-assets/generated-v1/chroma
          cat image-assets/upload_chunks/part_* | tr -d '\n' | base64 -d > image-assets/PEELBEAST_IMAGE_ASSET_PACK_GITHUB_LITE_v1.zip
          rm -rf /tmp/peelbeast-assets
          mkdir -p /tmp/peelbeast-assets
          unzip -q -o image-assets/PEELBEAST_IMAGE_ASSET_PACK_GITHUB_LITE_v1.zip -d /tmp/peelbeast-assets
          cp -R /tmp/peelbeast-assets/generated-v1/chroma/. image-assets/generated-v1/chroma/
          cp /tmp/peelbeast-assets/README.md image-assets/GENERATED_ASSETS_README.md
          cp /tmp/peelbeast-assets/SHA256SUMS.txt image-assets/SHA256SUMS.txt

      - name: Commit generated binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image-assets/PEELBEAST_IMAGE_ASSET_PACK_GITHUB_LITE_v1.zip image-assets/generated-v1 image-assets/GENERATED_ASSETS_README.md image-assets/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Add PEELBEAST image asset binaries'
          git push origin HEAD:${{ github.ref_name }}
